<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>داشبورد مدیریتی عسلویه</title>
<link rel="icon" id="fav" href="">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#eef1f6; --card:#ffffff; --line:#e3e6ec; --grid:#eceef3; --t1:#0f172a; --t2:#4b5563; --t3:#8a8f98;
  --brand1:#0b2a55; --brand2:#2a78d6; --bred:#c4161c; --bgreen:#00775f;
  --good:#0ca30c; --warn:#b27400; --crit:#d03b3b; --muted:#8a8f98;
  --s1:#2a78d6; --s1b:#86b6ef; --s1soft:#cde2fb; --s2:#eb6834; --s3:#1baf7a; --s7:#4a3aa7; --neutral:#c9c8c2; --ghost:#f1f3f7;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;--bg:#0d1014;--card:#171a20;--line:#272b33;--grid:#22262d;--t1:#f5f6f8;--t2:#c3c6cc;--t3:#8d9199;--brand1:#071a36;--brand2:#184f95;--s1:#3987e5;--s1b:#2a5d9e;--s1soft:#1c3558;--s2:#d95926;--s3:#199e70;--s7:#9085e9;--neutral:#4a4a46;--ghost:#1f232a;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25)}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1014;--card:#171a20;--line:#272b33;--grid:#22262d;--t1:#f5f6f8;--t2:#c3c6cc;--t3:#8d9199;--brand1:#071a36;--brand2:#184f95;--s1:#3987e5;--s1b:#2a5d9e;--s1soft:#1c3558;--s2:#d95926;--s3:#199e70;--s7:#9085e9;--neutral:#4a4a46;--ghost:#1f232a;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t1);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none}
.wrap{max-width:1300px;margin:0 auto;padding:20px 16px 48px}

/* ---------- header ---------- */
header{position:relative;overflow:hidden;border-radius:24px;color:#fff;background:linear-gradient(125deg,var(--brand1) 0%,#123f7a 45%,var(--brand2) 100%);box-shadow:0 18px 40px rgba(11,42,85,.25);padding:22px 28px;transition:padding .3s}
header.hero{padding:44px 40px 40px;min-height:280px;display:flex;flex-direction:column;justify-content:space-between}
header .bgfx{position:absolute;inset:0;pointer-events:none;opacity:.55}
header .bgfx svg{width:100%;height:100%}
header::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;inset:-200px auto auto -140px;background:radial-gradient(circle,rgba(120,180,255,.35),transparent 65%);pointer-events:none}
header .brandline{position:absolute;inset:auto 0 0 0;height:5px;background:linear-gradient(90deg,var(--bgreen) 0 33%,#fff 33% 34%,var(--bred) 34% 100%);opacity:.9}
.htop{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;position:relative;z-index:1}
.hid{display:flex;align-items:center;gap:20px}
.htxt h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px}
.htxt p{margin:2px 0 0;opacity:.85;font-size:13px}
header.hero .htxt h1{font-size:38px;font-weight:900}
header.hero .htxt p{font-size:16px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.hbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:999px;padding:6px 14px;font-family:inherit;font-size:12.5px;cursor:pointer;backdrop-filter:blur(6px)}
.hbtn:hover{background:rgba(255,255,255,.26)}
/* logo badge with glow + shine */
.logo{position:relative;display:inline-block;background:rgba(255,255,255,.97);border-radius:16px;padding:8px 14px;overflow:hidden;flex:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.7),0 8px 26px rgba(0,0,0,.18),0 0 34px rgba(140,190,255,.35);animation:glow 4.5s ease-in-out infinite}
.logo img{display:block;height:46px;width:auto}
header.hero .logo{padding:16px 26px;border-radius:24px}
header.hero .logo img{height:104px}
.logo::after{content:"";position:absolute;top:0;bottom:0;width:45%;left:-60%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.95) 50%,transparent);transform:skewX(-18deg);animation:shine 6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.7),0 8px 26px rgba(0,0,0,.18),0 0 28px rgba(140,190,255,.30)}50%{box-shadow:0 0 0 1px rgba(255,255,255,.9),0 8px 26px rgba(0,0,0,.18),0 0 64px rgba(170,210,255,.70)}}
@keyframes shine{0%,62%{left:-60%}82%,100%{left:130%}}
@media (prefers-reduced-motion: reduce){.logo,.logo::after,.pulse{animation:none!important}}
.crumb{margin-top:14px;font-size:13px;position:relative;z-index:1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb:empty{display:none}
.crumb a{background:rgba(255,255,255,.14);padding:3px 12px;border-radius:999px}
.crumb a:hover{background:rgba(255,255,255,.26)}
.hstats{position:relative;z-index:1;display:none;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}
header.hero .hstats:not(:empty){display:grid}
.hs{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px 16px;backdrop-filter:blur(8px)}
.hs .l{font-size:12px;opacity:.85}
.hs .v{font-size:24px;font-weight:800;margin-top:2px}
.hs .v small{font-size:12px;font-weight:500;opacity:.85;margin-inline-start:4px}
.hs .s{font-size:11.5px;opacity:.8}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5be37a;box-shadow:0 0 0 0 rgba(91,227,122,.6);animation:pulse 2s infinite;margin-inline-end:6px;vertical-align:middle}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(91,227,122,.6)}70%{box-shadow:0 0 0 9px rgba(91,227,122,0)}100%{box-shadow:0 0 0 0 rgba(91,227,122,0)}}

/* ---------- home tiles ---------- */
.secttl{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px;gap:12px;flex-wrap:wrap}
.secttl h2{margin:0;font-size:19px}
.secttl span{color:var(--t2);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .2s ease, box-shadow .2s ease;box-shadow:var(--shadow)}
.tile:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(15,23,42,.16)}
.tile .art{height:160px;overflow:hidden}
.tile .art svg{width:100%;height:100%;display:block;transition:transform .5s ease}
.tile:hover .art svg{transform:scale(1.06)}
.body{padding:14px 18px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h3{margin:0;font-size:18px;font-weight:800}
.body p{margin:0;color:var(--t2);font-size:13.5px}
.meta{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--t2);gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.chip.on{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)} .chip.on i{background:var(--good)}
.chip.wip{color:var(--warn);background:color-mix(in srgb,#fab219 18%,transparent)} .chip.wip i{background:#fab219}
.chip.off{color:var(--muted);background:color-mix(in srgb,var(--muted) 14%,transparent)} .chip.off i{background:var(--muted)}
.go{font-weight:700;color:var(--brand2)}
.chip.demo{color:#6b5bd6;background:color-mix(in srgb,#6b5bd6 13%,transparent)} .chip.demo i{background:#6b5bd6}
.demo-banner{margin-top:14px;border-radius:14px;padding:10px 16px;font-size:12.5px;color:var(--t2);background:repeating-linear-gradient(135deg,color-mix(in srgb,#6b5bd6 9%,transparent) 0 14px,color-mix(in srgb,#6b5bd6 4%,transparent) 14px 28px);border:1px solid color-mix(in srgb,#6b5bd6 30%,transparent)}
.demo-banner b{color:#6b5bd6}
.grp{display:flex;align-items:center;gap:8px;margin:22px 4px 10px;font-size:14px;color:var(--t2);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:6px}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;gap:14px;cursor:pointer;transition:transform .15s, box-shadow .15s;box-shadow:var(--shadow);position:relative;overflow:hidden}
.item::after{content:"";position:absolute;inset:auto -30px -40px auto;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%)}
.item:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(15,23,42,.13)}
.ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 22%,transparent),color-mix(in srgb,var(--accent) 8%,transparent));color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 20%,transparent)}
.ic svg{width:26px;height:26px}
.item h3{margin:0 0 2px;font-size:15.5px}
.item .sub{color:var(--t2);font-size:12.5px;margin:0}
.item .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px}
.item .kv{font-size:12px;color:var(--t2);margin-top:4px}
.item .kv b{color:var(--t1)}

/* ---------- page ---------- */
.toolbar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:16px 0;box-shadow:var(--shadow);position:sticky;top:8px;z-index:5}
.fld{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--t2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--ghost)}
.seg button{border:0;background:transparent;color:var(--t2);padding:5px 11px;font-family:inherit;font-size:12.5px;cursor:pointer}
.seg button.act{background:linear-gradient(135deg,var(--brand2),#4a91e6);color:#fff;box-shadow:0 2px 8px rgba(42,120,214,.35)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
select{font-family:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:10px;padding:5px 8px;background:var(--card);color:var(--t1)}
.pghead{display:flex;gap:14px;align-items:center;margin-top:22px}
.pghead .ic{width:58px;height:58px;border-radius:18px}
.pghead .ic svg{width:30px;height:30px}
.pghead h2{margin:0;font-size:22px}
.pghead p{margin:0;color:var(--t2);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;position:relative;overflow:hidden;min-height:118px;box-shadow:var(--shadow)}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent,var(--s1)),color-mix(in srgb,var(--accent,var(--s1)) 40%,transparent))}
.kpi::after{content:"";position:absolute;inset:-40px -40px auto auto;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent,var(--s1)) 10%,transparent),transparent 70%)}
.kpi .l{font-size:12.5px;color:var(--t2);font-weight:500;position:relative}
.kpi .v{font-size:26px;font-weight:800;margin:4px 0 0;letter-spacing:-.3px;position:relative}
.kpi .v small{font-size:12px;color:var(--t2);font-weight:500;margin-inline-start:4px}
.kpi .s{font-size:11.5px;color:var(--t2);position:relative}
.kpi.pend .v{font-size:15px;color:var(--t3);font-weight:700}
.kpi svg.spark{position:absolute;inset:auto 12px 10px auto;width:90px;height:30px;opacity:.9}
.meter{height:8px;border-radius:99px;background:var(--grid);margin:8px 0 4px;position:relative;overflow:hidden}
.meter i{position:absolute;inset-inline-start:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--s7),#7b6fe0)}
.meter b{position:absolute;top:0;bottom:0;width:2px;background:var(--t1)}
.prep{display:inline-flex;align-items:center;gap:6px;color:var(--warn);background:color-mix(in srgb,#fab219 16%,transparent);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.prep::before{content:"";width:6px;height:6px;border-radius:50%;background:#fab219}
.owner{font-size:11px;color:var(--t3)}
.cycle{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:12px;box-shadow:var(--shadow)}
.cycle .st{font:inherit;color:inherit;text-align:start;cursor:pointer;border:0;border-inline-start:1px solid var(--line);background:transparent;transition:background .2s}
.st{padding:12px 14px;border-inline-start:1px solid var(--line);position:relative}
.st:first-child{border-inline-start:0}
.st:not(:last-child)::after{content:"";position:absolute;inset-inline-end:-7px;top:50%;width:12px;height:12px;background:var(--card);border-top:1px solid var(--line);border-inline-start:1px solid var(--line);transform:translateY(-50%) rotate(-45deg);z-index:1}
.st .n{font-size:11px;color:var(--t3)}
.st .l{font-size:13px;font-weight:700}
.st .v{font-size:18px;font-weight:800;margin-top:2px}
.st .v.p{font-size:12.5px}
.st.done{background:linear-gradient(180deg,color-mix(in srgb,var(--good) 7%,transparent),transparent)}
.cycle .st:hover{background:color-mix(in srgb,var(--brand2) 6%,transparent)}
.cycle .st.sel{background:color-mix(in srgb,var(--brand2) 11%,transparent);box-shadow:inset 0 -3px 0 var(--brand2)}
.st .car{font-size:10px;color:var(--t3);display:inline-block;transition:transform .2s}.st.sel .car{transform:rotate(180deg);color:var(--brand2)}
.st .v small{font-size:11px;font-weight:600;color:var(--t3)}
.cysub{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px 8px;box-shadow:var(--shadow);animation:cyin .25s ease}
@keyframes cyin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.cyh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}.cyh b{font-size:14px}.cyh .x{margin-inline-start:auto;border:0;background:none;color:var(--t3);cursor:pointer;font-size:14px}
.cysub table{width:100%;border-collapse:collapse;font-size:13px}.cysub td{padding:7px 6px;border-top:1px solid var(--line)}
.cysub td.a{text-align:end;font-weight:700;white-space:nowrap;width:22%}.cysub td.p{width:26%}
.cysub tr.m td.a{color:var(--crit)}.cysub tr.i td{color:var(--t3)}.cysub tr.i td.t::after{content:" (اطلاعاتی)";font-size:11px}
.cysub tr.t td{font-weight:800;border-top:2px solid var(--t2);background:color-mix(in srgb,var(--brand2) 5%,transparent)}
.cysub .cb{display:inline-block;height:6px;border-radius:3px;background:var(--brand2);opacity:.55;vertical-align:middle;margin-inline-end:6px}
.cards2{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0;box-shadow:var(--shadow)}
.card h3{margin:0;font-size:15px}
.card .d{margin:2px 0 8px;color:var(--t2);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--t2);margin-bottom:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.sw.line{height:3px}
.ghost{height:230px;border-radius:14px;background:repeating-linear-gradient(135deg,var(--ghost) 0 10px,transparent 10px 20px);border:1px dashed var(--line);display:grid;place-items:center;text-align:center;color:var(--t3);font-size:13px}
svg.ch{display:block;width:100%;height:auto;overflow:visible;direction:ltr}
svg.ch text{font-family:inherit;fill:var(--t2);font-size:11px}
.tblwrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{color:var(--t2);font-weight:700;text-align:right;padding:9px 10px;background:linear-gradient(180deg,var(--ghost),color-mix(in srgb,var(--ghost) 60%,var(--card)));white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--grid);white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--ghost) 55%,transparent)}
tbody tr:hover td{background:color-mix(in srgb,var(--s1) 8%,transparent)}
tbody tr:last-child td{border-bottom:0}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-weight:700;font-size:11.5px}
.pill.up{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.pill.dn{color:var(--crit);background:color-mix(in srgb,var(--crit) 11%,transparent)}
.bar{display:inline-block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--s1),var(--s1b));vertical-align:middle;margin-inline-start:8px}
.ins{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.insight{border-radius:16px;padding:12px 14px;font-size:13px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);position:relative;overflow:hidden}
.insight::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--c)}
.insight b{display:block;font-size:13.5px;margin-bottom:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:8px 16px;font-size:13px;font-weight:700;border:1px solid var(--line);cursor:pointer;background:var(--card);color:var(--t1);font-family:inherit;box-shadow:var(--shadow)}
.btn.pri{background:linear-gradient(135deg,var(--accent,var(--brand2)),color-mix(in srgb,var(--accent,var(--brand2)) 70%,#fff));color:#fff;border-color:transparent}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.note{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:12px 16px;color:var(--t2);font-size:12.5px;margin-top:14px}
#tip{position:fixed;pointer-events:none;background:var(--card);color:var(--t1);border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.18);border-radius:12px;padding:8px 12px;font-size:12px;opacity:0;transition:opacity .12s;z-index:20}
#tip .row{display:flex;justify-content:space-between;gap:14px;color:var(--t2)} #tip b{color:var(--t1)}
.hit{fill:transparent;cursor:pointer}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;position:relative}
.fbox h4{margin:0 0 4px;font-size:14px}
.fbox p{margin:0;font-size:12.5px;color:var(--t2)}
.fbox .num{position:absolute;top:10px;inset-inline-end:12px;font-weight:800;color:var(--t3)}
.road{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:8px}
.wk{border-radius:10px;padding:8px;font-size:11.5px;background:var(--ghost);border:1px solid var(--line);min-height:84px}
.wk b{display:block;font-size:12px}
.wk.now{background:color-mix(in srgb,var(--brand2) 14%,transparent);border-color:var(--brand2)}
.prin{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
footer{color:var(--t3);font-size:12px;margin-top:26px;text-align:center;display:flex;justify-content:center;align-items:center;gap:10px}
footer img{height:22px;opacity:.8}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:1100px){.grid,.items,.ins{grid-template-columns:repeat(2,1fr)}.kpis,header.hero .hstats{grid-template-columns:repeat(2,1fr)}.cards2{grid-template-columns:1fr}.flow,.prin{grid-template-columns:1fr 1fr}.road{grid-template-columns:repeat(4,1fr)}}
@media (max-width:680px){.grid,.items,.kpis,.flow,.prin,.ins,header.hero .hstats{grid-template-columns:1fr}.cycle{grid-template-columns:1fr 1fr}.road{grid-template-columns:1fr 1fr}header,header.hero{padding:22px 18px}header.hero .htxt h1{font-size:24px}header.hero .logo img{height:64px}.hid{flex-wrap:wrap}.toolbar{position:static}}
@media print{.hbtns,.toolbar{display:none}body{background:#fff}.logo,.logo::after{animation:none}}
</style>
</head>
<body>

function showTip(e,t,rows){tip.innerHTML=`<div style="font-weight:700;margin-bottom:3px">${t}</div>`+rows.map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');tip.style.opacity=1;const w=tip.offsetWidth;let x=e.clientX-w-14;if(x<8)x=e.clientX+14;tip.style.left=x+'px';tip.style.top=(e.clientY+14)+'px';}
function hideTip(){tip.style.opacity=0;}
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function txt(p,x,y,s,a={}){const t=el('text',Object.assign({x,y},a),p);t.textContent=s;return t;}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return [1,1.2,1.5,2,2.5,3,4,5,6,8,10].find(k=>n<=k)*p;}
function findItem(sid,iid){const s=SECTIONS.find(x=>x.id===sid);return s?[s,s.items.find(i=>i.id===iid)]:[null,null];}
function setHero(on){HDR.classList.toggle('hero',on);}
function gradDefs(s,id,c1,c2){const d=el('defs',{},s);const g=el('linearGradient',{id,x1:0,y1:0,x2:0,y2:1},d);el('stop',{offset:0,'stop-color':c1},g);el('stop',{offset:1,'stop-color':c2},g);return d;}
